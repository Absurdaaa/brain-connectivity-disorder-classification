hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - datasz=100p
    - model=ASDFormer,comtf,bnt
    - dataset=ADHD200
    - repeat_time=1
    - preprocess=non_mixup
  job:
    name: __main__
    chdir: null
    override_dirname: dataset=ADHD200,datasz=100p,model=ASDFormer,comtf,bnt,preprocess=non_mixup,repeat_time=1
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /Users/linshangjin/Desktop/dachuang/models/unified
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/linshangjin/Desktop/dachuang/models/unified/source/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      preprocess: non_mixup
      datasz: 100p
      training: basic_training
      optimizer: adam
      model: ASDFormer
      dataset: ADHD200
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
dataset:
  name: adhd200
  batch_size: 64
  test_batch_size: 64
  val_batch_size: 64
  train_set: 0.7
  val_set: 0.1
  path: /Users/linshangjin/Desktop/dachuang/data/adhd200.npy
  stratified: false
  drop_last: true
model:
  model_type: ASDFormer
  name: ASDFormer
  node_cluster_assignments:
  - 41
  - 70
  - 91
  - 110
  - 130
  - 137
  - 158
  - 200
  dropout: 0.1
  bias: true
  time_series_len: 100
  num_classes: 2
  num_degree: 200
  num_ROIs: 200
  activation_fn: gelu
  regularization_co: 0.23
  num_attention_heads: 8
  num_hidden_layers: 1
  embedding_dim: 200
  ffn_embedding_dim: 1024
  kdim: 200
  vdim: 200
  feature_encoder_hidden: 256
  feature_encoder_layer: 2
  k1: 8
  k2: 4
  dim_reduc_ratio: 4
  dim_reduc_hidden: 1024
  dim_reduc_layer: 2
  expert_hidden: 768
  expert_layer: 2
  classifier_hidden: 256
  classifier_layer: 2
  gate_hidden: 256
  gate_layer: 2
  use_partial: true
  use_pool_loss: false
  use_regularization: true
optimizer:
  name: Adam
  lr: 0.0001
  match_rule: None
  except_rule: None
  weight_decay: 0.0001
  lr_scheduler:
    mode: cos
    base_lr: 0.0001
    target_lr: 1.0e-05
    decay_factor: 0.1
    milestones:
    - 0.3
    - 0.6
    - 0.9
    poly_power: 2.0
    lr_decay: 0.98
    warm_up_from: 0.0
    warm_up_steps: 0
training:
  name: Train
  epochs: 50
  tolerance: 20
datasz:
  percentage: 1.0
preprocess:
  name: non_mixup
  continus: false
repeat_time: 1
log_path: result
save_learnable_graph: false
save_attn_weights: true
project: unified-brain
