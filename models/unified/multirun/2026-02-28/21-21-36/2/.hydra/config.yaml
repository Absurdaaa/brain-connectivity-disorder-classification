dataset:
  name: adhd200
  batch_size: 64
  test_batch_size: 64
  val_batch_size: 64
  train_set: 0.7
  val_set: 0.1
  path: /Users/linshangjin/Desktop/dachuang/data/adhd200.npy
  stratified: false
  drop_last: true
model:
  name: BrainNetworkTransformer
  sizes:
  - 360
  - 100
  pooling:
  - false
  - true
  pos_encoding: none
  orthogonal: true
  freeze_center: true
  project_assignment: true
  pos_embed_dim: 360
  use_partial: false
  use_pool_loss: false
  use_regularization: false
optimizer:
  name: Adam
  lr: 0.0001
  match_rule: None
  except_rule: None
  weight_decay: 0.0001
  lr_scheduler:
    mode: cos
    base_lr: 0.0001
    target_lr: 1.0e-05
    decay_factor: 0.1
    milestones:
    - 0.3
    - 0.6
    - 0.9
    poly_power: 2.0
    lr_decay: 0.98
    warm_up_from: 0.0
    warm_up_steps: 0
training:
  name: Train
  epochs: 50
  tolerance: 20
datasz:
  percentage: 1.0
preprocess:
  name: non_mixup
  continus: false
repeat_time: 1
log_path: result
save_learnable_graph: false
save_attn_weights: true
project: unified-brain
