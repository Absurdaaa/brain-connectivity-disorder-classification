dataset:
  name: abide_net
  batch_size: 64
  test_batch_size: 64
  val_batch_size: 64
  train_set: 0.7
  val_set: 0.1
  path: ../../../data/abide_networkmatrix.npy
  stratified: true
  drop_last: true
model:
  model_type: ASDFormer
  name: ASDFormer
  node_cluster_assignments:
  - 41
  - 70
  - 91
  - 110
  - 130
  - 137
  - 158
  - 200
  dropout: 0.1
  bias: true
  time_series_len: 100
  num_classes: 2
  num_degree: 200
  num_ROIs: 200
  activation_fn: gelu
  regularization_co: 0.23
  num_attention_heads: 8
  num_hidden_layers: 1
  embedding_dim: 200
  ffn_embedding_dim: 1024
  kdim: 200
  vdim: 200
  feature_encoder_hidden: 256
  feature_encoder_layer: 2
  k1: 8
  k2: 4
  dim_reduc_ratio: 4
  dim_reduc_hidden: 1024
  dim_reduc_layer: 2
  expert_hidden: 768
  expert_layer: 2
  classifier_hidden: 256
  classifier_layer: 2
  gate_hidden: 256
  gate_layer: 2
  use_partial: true
  use_pool_loss: false
  use_regularization: true
optimizer:
  name: Adam
  lr: 0.0001
  match_rule: None
  except_rule: None
  weight_decay: 0.001
  lr_scheduler:
    mode: cos
    base_lr: 0.0001
    target_lr: 1.0e-05
    decay_factor: 0.1
    milestones:
    - 0.3
    - 0.6
    - 0.9
    poly_power: 2.0
    lr_decay: 0.98
    warm_up_from: 0.0
    warm_up_steps: 0
training:
  name: Train
  epochs: 50
  tolerance: 20
datasz:
  percentage: 1.0
preprocess:
  name: non_mixup
  continus: false
repeat_time: 1
log_path: result
save_learnable_graph: false
save_attn_weights: true
project: unified-brain
